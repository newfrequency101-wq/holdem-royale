<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0806; overflow: hidden; color: #fff; touch-action: manipulation;
    font-family: "Segoe UI", Roboto, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  body { position: fixed; inset: 0; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; overflow: hidden;
    transform-origin: center; border-radius: 14px;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,.78) 100%),
      repeating-conic-gradient(from 45deg, rgba(255,255,255,.035) 0 25%, rgba(0,0,0,.08) 0 50%) 0 0/56px 56px,
      linear-gradient(#8a4a22, #6b3517); }
  .hidden { display: none !important; }
  .screen { position: absolute; inset: 0; }
  .title { font-family: Impact, "Arial Black", sans-serif; letter-spacing: 2px; font-weight: 400; }
  .gold { color: #f0c862; text-shadow: 0 2px 0 #6b4a12, 0 0 14px rgba(255,200,80,.35); }

  .btn { border: 0; cursor: pointer; font: inherit; font-weight: 800; border-radius: 40px; padding: 12px 28px;
    color: #fff; transition: transform .08s, filter .15s; white-space: nowrap; }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: scale(.96); }
  .btn:disabled { filter: grayscale(.85) brightness(.55); cursor: default; transform: none; }
  .btn-gold { background: linear-gradient(#ffe07a, #f2b51c 55%, #d48f06); color: #5a2e00;
    box-shadow: 0 4px 0 #8a5600, 0 6px 14px rgba(0,0,0,.5); text-shadow: 0 1px 0 rgba(255,255,255,.5); }
  .btn-brown { background: linear-gradient(#cf7c42, #9c5326); box-shadow: 0 4px 0 #5e2e10, inset 0 1px 0 rgba(255,255,255,.3); }
  .btn-slate { background: linear-gradient(#636c80, #3a4050); box-shadow: 0 4px 0 #20242e; }
  .btn-red { background: linear-gradient(#e85a4f, #b02a22); box-shadow: 0 4px 0 #6d1510; }
  .btn-green { background: linear-gradient(#3cc47c, #1d8a51); box-shadow: 0 4px 0 #0e5430; }

  /* ---------- lobby ---------- */
  .logo { position: absolute; left: 40px; top: 22px; font-size: 46px; }
  .logo small { font-size: 20px; color: #e3b9a0; text-shadow: none; letter-spacing: 6px; margin-left: 10px; }
  .icon-btn { position: absolute; width: 52px; height: 52px; border-radius: 50%; border: 2px solid rgba(240,200,98,.6);
    background: rgba(0,0,0,.35); color: #fff; font-size: 24px; cursor: pointer; }
  #muteBtn { right: 30px; top: 22px; }
  .panels { position: absolute; left: 40px; right: 40px; top: 100px; height: 480px; display: flex; gap: 24px; }
  .panel { flex: 1; position: relative; border-radius: 16px; padding: 22px 26px; text-align: center;
    background: linear-gradient(rgba(214,128,70,.55), rgba(150,72,30,.55));
    border: 2px solid rgba(255,190,130,.35); box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); }
  .panel-sub { font-size: 15px; letter-spacing: 8px; color: #f3d2a8; font-weight: 700; }
  .panel-title { font-size: 52px; line-height: 1.05; margin: 4px 0 10px; }
  .blue { color: #3fb2ff; text-shadow: 0 3px 0 #0b3a77, 0 0 16px rgba(80,170,255,.4); }
  .green { color: #2fe09a; text-shadow: 0 3px 0 #0b5a3a, 0 0 16px rgba(60,230,150,.35); }
  .picker { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0 12px; }
  .arrow { width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; font-size: 28px; font-weight: 900;
    color: #fff; background: linear-gradient(#cf7c42, #9c5326); box-shadow: 0 3px 0 #5e2e10; line-height: 1; }
  .arrow:disabled { opacity: .3; cursor: default; }
  .stage-name { font-size: 30px; width: 170px; }
  .stage-name.hr { color: #ffd65a; }
  .kv { font-size: 18px; color: #f6dcc0; margin: 4px 0; letter-spacing: 1px; }
  .kv b { color: #fff; font-size: 22px; margin-left: 6px; }
  .mini-felt { margin: 14px auto 12px; width: 260px; height: 110px; border-radius: 60px; position: relative;
    background: radial-gradient(#22a063, #0d5733); border: 8px solid #1d1d21; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  .mini-felt span { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #2b2d36;
    border: 2px solid #c9a24a; font-size: 15px; display: grid; place-items: center; }
  .mini-felt em { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal;
    font-weight: 800; color: rgba(255,255,255,.75); font-size: 15px; }
  .panel .btn.big { font-size: 24px; padding: 14px 0; width: 100%; position: absolute; left: 26px; right: 26px; bottom: 24px; width: auto; }
  .prize-label { color: #ffd65a; font-weight: 800; font-size: 18px; }
  .prize { font-size: 64px; font-weight: 900; line-height: 1; margin: 2px 0 8px;
    background: linear-gradient(#fff3b0, #ffc928 50%, #e08a00); -webkit-background-clip: text; background-clip: text;
    color: transparent; filter: drop-shadow(0 3px 0 #6b3a00); }
  .faces { font-size: 34px; letter-spacing: 6px; margin: 10px 0 6px; }
  #sngLock:empty { display: none; }
  .link-btn { border: 0; background: none; cursor: pointer; font: inherit; font-size: 15px; font-weight: 700;
    color: #ffe58a; text-decoration: underline; padding: 4px 8px; }
  #liveQ { left: 16px; top: 540px; max-width: 450px; flex-wrap: wrap; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: #c7cbd4; }
  #liveQ b { font-size: 20px; letter-spacing: 2px; }
  #liveQ button { border: 0; cursor: pointer; font: inherit; font-weight: 900; font-size: 13px; color: #5a2e00;
    background: linear-gradient(#ffe07a, #f2b51c); border-radius: 14px; padding: 5px 12px; }
  body.mobile #liveQ { top: 500px; font-size: 16px; }
  body.mobile #liveQ b { font-size: 26px; }
  body.mobile #liveQ button { font-size: 17px; padding: 8px 16px; }
  .lock { font-size: 14px; color: #ffb3a1; margin-top: 4px; height: 18px; }

  .profile-top { display: flex; align-items: center; gap: 16px; text-align: left; margin-top: 6px; }
  .avatar-lg { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; font-size: 54px;
    background: radial-gradient(#3b3f4d, #1b1d24); border: 3px solid #c9a24a; cursor: pointer; flex: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.5); }
  .pname-lg { font-size: 26px; font-weight: 800; cursor: pointer; }
  .pname-lg:after { content: " ✎"; font-size: 16px; opacity: .6; }
  .lvl { font-size: 15px; color: #f6dcc0; margin-top: 4px; }
  .lvl b { color: #fff; font-size: 20px; }
  .xpbar { width: 150px; height: 9px; border-radius: 5px; background: rgba(0,0,0,.45); margin-top: 5px; overflow: hidden; }
  .xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #3fb2ff, #7fd4ff); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 18px 0 14px; }
  .stat { background: rgba(0,0,0,.28); border-radius: 10px; padding: 7px 4px; }
  .stat div { font-size: 12px; color: #f3d2a8; letter-spacing: 1px; }
  .stat b { font-size: 20px; }
  .best-label { font-size: 13px; color: #f3d2a8; letter-spacing: 1px; margin-bottom: 6px; }
  .best-cards { display: flex; gap: 5px; justify-content: center; min-height: 74px; align-items: center; color: #e9c6a8; }

  .lobby-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; display: flex; align-items: center;
    gap: 22px; padding: 0 40px; background: linear-gradient(transparent, rgba(0,0,0,.6) 40%); }
  .pill { background: rgba(10,10,14,.75); border-radius: 30px; padding: 8px 24px 8px 10px; font-size: 26px; font-weight: 800;
    display: flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,.12); }
  .coin { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(#ffe68a, #e6a516 60%, #a86b00);
    border: 2px solid #ffd65a; display: grid; place-items: center; font-size: 15px; color: #7a4a00; font-weight: 900; }
  .free { margin-left: auto; text-align: center; }
  .free .btn { font-size: 22px; padding: 12px 30px; }
  .free div { font-size: 14px; color: #f3d2a8; margin-top: 6px; height: 18px; }

  /* ---------- table ---------- */
  #rail { position: absolute; left: 110px; top: 110px; width: 1060px; height: 480px; border-radius: 240px;
    background: linear-gradient(#34343a, #121214); box-shadow: 0 24px 60px rgba(0,0,0,.75), inset 0 2px 0 rgba(255,255,255,.15); }
  #felt { position: absolute; inset: 22px; border-radius: 220px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, #24a566, #137544 55%, #0b5230); box-shadow: inset 0 0 50px rgba(0,0,0,.6); }
  #felt:after { content: ""; position: absolute; inset: 12px; border-radius: 210px; border: 2px solid rgba(240,200,98,.45); }
  #feltLogo { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-size: 34px;
    color: rgba(255,255,255,.08); }
  #board { position: absolute; left: 640px; top: 330px; transform: translate(-50%,-50%); display: flex; gap: 8px; }
  .slot { width: 70px; height: 98px; border-radius: 8px; border: 2px dashed rgba(255,255,255,.13); position: relative; }
  .slot .card { position: absolute; left: -2px; top: -2px; }
  #pot { position: absolute; left: 640px; top: 252px; transform: translate(-50%,-50%); background: rgba(0,0,0,.5);
    border-radius: 20px; padding: 4px 16px 4px 6px; display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; }
  #pot small { color: #bfe8cf; font-size: 13px; letter-spacing: 1px; }
  #msg { position: absolute; left: 640px; top: 410px; transform: translateX(-50%); font-weight: 800; font-size: 18px;
    color: #ffe58a; text-shadow: 0 2px 4px rgba(0,0,0,.8); white-space: nowrap; text-align: center; }

  .card { position: relative; width: 52px; height: 74px; border-radius: 6px; background: linear-gradient(#fff, #e9ecf2);
    color: #15151a; box-shadow: 0 2px 6px rgba(0,0,0,.55); font-weight: 800; flex: none; transition: transform .25s, filter .25s, box-shadow .25s; }
  .card .r { position: absolute; left: 5px; top: 3px; font-size: 20px; line-height: 1; letter-spacing: -1px; }
  .card .s { position: absolute; left: 6px; top: 23px; font-size: 15px; line-height: 1; }
  .card .big { position: absolute; right: 5px; bottom: 3px; font-size: 30px; line-height: 1; }
  .card.red { color: #d21f2b; }
  .card.back { background: repeating-linear-gradient(45deg, #b3262e 0 6px, #8e1a21 6px 12px); border: 3px solid #f4f4f4; }
  .card.md { width: 70px; height: 98px; border-radius: 8px; }
  .card.md .r { font-size: 27px; left: 6px; } .card.md .s { font-size: 20px; top: 31px; left: 8px; } .card.md .big { font-size: 42px; }
  .card.lg { width: 78px; height: 108px; border-radius: 8px; }
  .card.lg .r { font-size: 30px; left: 7px; } .card.lg .s { font-size: 22px; top: 35px; left: 9px; } .card.lg .big { font-size: 46px; }
  .card.deal { animation: deal .35s ease-out both; }
  .card.flip { animation: flip .4s ease-out both; }
  @keyframes deal { from { transform: translate(0,-60px) scale(.5) rotate(-15deg); opacity: 0; } }
  @keyframes flip { from { transform: rotateY(90deg); } }
  .card.win { box-shadow: 0 0 0 3px #ffd34d, 0 0 20px #ffd34d; transform: translateY(-8px); }
  .card.dim { filter: brightness(.45); }

  .seat { position: absolute; width: 0; height: 0; }
  .seat .avatar { position: absolute; left: -42px; top: -42px; width: 84px; height: 84px; border-radius: 50%;
    background: radial-gradient(#3e4352, #1b1d24); border: 3px solid #c9a24a; display: grid; place-items: center;
    font-size: 46px; box-shadow: 0 4px 12px rgba(0,0,0,.6); transition: border-color .2s, box-shadow .2s; }
  .seat.turn .avatar { border-color: #5dff9d; animation: pulse .8s infinite alternate; }
  @keyframes pulse { from { box-shadow: 0 0 0 3px rgba(93,255,157,.3), 0 0 14px #5dff9d; }
                     to { box-shadow: 0 0 0 7px rgba(93,255,157,.15), 0 0 30px #5dff9d; } }
  .seat.folded .avatar, .seat.folded .cards { opacity: .4; }
  .seat.out .avatar, .seat.out .nameplate { opacity: .35; }
  .nameplate { position: absolute; left: -72px; top: 38px; width: 144px; text-align: center; background: rgba(10,10,14,.85);
    border-radius: 10px; padding: 3px 0 4px; border: 1px solid rgba(255,255,255,.12); }
  .pname { font-size: 14px; color: #cfd3dc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 6px; }
  .pchips { font-size: 17px; font-weight: 800; color: #ffd86b; }
  .seat .kind { position: absolute; left: 18px; top: 8px; width: 34px; height: 34px; border-radius: 50%; display: grid;
    place-items: center; font-size: 20px; background: #1b1d24; border: 2px solid #c9a24a; box-shadow: 0 2px 5px rgba(0,0,0,.6); }
  .seat .kind:empty { display: none; }
  .seat.real .kind, .seat.me .kind.human { border-color: #4aa8ff; }
  .seat .ring { position: absolute; left: -54px; top: -54px; width: 108px; height: 108px; border-radius: 50%; display: none;
    background: conic-gradient(var(--c, #3cdc84) calc(var(--p, 1) * 360deg), rgba(0,0,0,.5) 0);
    -webkit-mask: radial-gradient(circle, transparent 44px, #000 45px); mask: radial-gradient(circle, transparent 44px, #000 45px);
    filter: drop-shadow(0 0 6px var(--c, #3cdc84)); }
  .seat .ring.on { display: block; }
  .seat .clock { position: absolute; left: -64px; top: -62px; width: 42px; height: 42px; border-radius: 50%; display: grid;
    place-items: center; font-weight: 900; font-size: 22px; background: #1d9a58; border: 3px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.6); z-index: 4; }
  .seat .clock.low { background: #d3302a; animation: pulse-clock .5s infinite alternate; }
  .seat .clock:empty { display: none; }

<script>
'use strict';
const $ = s => document.querySelector(s);

// ---------------------------------------------------------------- save data
// Address of the multiplayer server for cash games, e.g. 'https://holdem-royale.onrender.com'.
// Leave it empty when the game server itself serves this page. If no server can be reached,
// cash games are played offline against bots.
const SERVER_URL = 'https://holdem-royale.onrender.com';
const FREE_AMOUNT = 2000, FREE_EVERY = 3 * 3600 * 1000;
const DEF = { bankroll: 10000, name: 'You', avatar: '😎', freeAt: 0, seated: 0, cashSel: 0, sngSel: 0,
  muted: false, fast: false, meter: true,
  stats: { hands: 0, wins: 0, biggest: 0, sngWins: 0, bestScore: -1, bestCards: [], bestName: '' } };
let S = JSON.parse(JSON.stringify(DEF));
try {
  const raw = JSON.parse(localStorage.getItem('holdemRoyale') || 'null');
  if (raw) S = Object.assign(S, raw, { stats: Object.assign(S.stats, raw.stats || {}) });
} catch (e) {}
if (S.seated > 0) { S.bankroll += S.seated; S.seated = 0; }  // chips left on a table when the page closed
function save() { try { localStorage.setItem('holdemRoyale', JSON.stringify(S)); } catch (e) {} }
save();

// ---------------------------------------------------------------- sound
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); loadSamples(AC); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
// Recorded sounds (mono WAV), decoded once the audio system starts. The synthesized sounds below

function startGame(mode, idx) {
  ac(); goLandscape();
  // A Sit-N-Go against bots is a free practice game: no buy-in and no prizes.

  if (mode === 'cash') {

    G.players.push({ name: S.name, avatar: S.avatar, chips: cost, isHuman: true });
    for (let i = 1; i < 5; i++) G.players.push(newBot(botStack()));
  } else {
    G.sb = SNG_BLINDS[0][0]; G.bb = SNG_BLINDS[0][1];
    G.players.push({ name: S.name, avatar: S.avatar, chips: SNG_STACK, isHuman: true });

function joinOnline(idx) {
  return new Promise(resolve => {
    let ws, settled = false;
    const finish = ok => {
      if (settled) return;
      settled = true; clearTimeout(timer);
      if (!ok) { try { ws.close(); } catch (e) {} }
      resolve(ok);
    };
    const timer = setTimeout(() => finish(false), 20000);
    try { ws = new WebSocket(wsUrl()); } catch (e) { finish(false); return; }
    ws.onopen = () => ws.send(JSON.stringify({ t: 'join', stage: idx, name: S.name, avatar: S.avatar }));
    ws.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (err) { return; }
      if (!settled && m.t === 'joined') { finish(true); startOnline(ws, idx); return; }
      if (G && G.ws === ws) { G.queue.push(m); pump(); }
    };
    ws.onerror = () => finish(false);
    ws.onclose = () => { if (!settled) finish(false); else if (G && G.ws === ws) connectionLost(); };
  });
}

function startOnline(ws, idx, mode = 'cash') {
  const cash = mode === 'cash', buy = cash ? CASH[idx].buy : SNG[idx].buy;
  S.bankroll -= buy; if (cash) S.seated = buy;
  save();
  const blank = () => ({ name: '', avatar: '', chips: 0, cards: [], bet: 0, total: 0 });
  G = { mode, online: true, idx, ws, queue: [], pumping: false, token: Math.random(), players: [0, 1, 2, 3, 4].map(blank),
    dealer: 0, handNo: 0, board: [], turn: -1, sb: cash ? CASH[idx].sb : SNG_BLINDS[0][0], bb: cash ? CASH[idx].bb : SNG_BLINDS[0][1],
    me: 0, myChips: buy, shownTurn: -1, infoKey: '' };

  buildTable();

async function pump() {
  if (!G || !G.online || G.pumping) return;
  const g = G; g.pumping = true;
  while (G === g && g.queue.length) {
    const m = g.queue.shift();
    if (m.t === 'ev') { try { await handleEvent(m.ev, m.s); } catch (e) { console.error(e); } }
  }
  g.pumping = false;
}

async function handleEvent(ev, s) {
  const fast = G.queue.length > 15; // catch up quickly after the tab was in the background
  const vis = i => (i - G.me + 5) % 5;
  if (ev.kind === 'collect') { if (!fast) await animateCollect(); return; }
  if (ev.kind === 'hand') els.slots.forEach(sl => { sl.innerHTML = ''; });
  if (!fast) {
    if (ev.kind === 'hand') sfx.shuffle();
    if (ev.kind === 'deal') sfx.card();
    if (ev.kind === 'board' || ev.kind === 'reveal') sfx.flip();
    if (ev.kind === 'action') (ev.type === 'fold' ? sfx.fold : ev.type === 'check' ? sfx.check : sfx.chip)();
  }
  if (ev.kind === 'action' && ev.timeout && ev.seat === s.you && G.dingFor !== G.shownTurn) { G.dingFor = G.shownTurn; sfx.ding(); buzz(250); }
  applyState(s);
  if (ev.notice) notice(ev.notice);
  const me = s.you >= 0 ? s.seats[s.you] : null;
  switch (ev.kind) {
    case 'win': case 'showdown': {
      ev.wins.forEach(w => flyChips(vis(w.seat), w.amt));
      const mine = ev.wins.find(w => w.seat === s.you);
      if (mine) sfx.win(); else if (ev.kind === 'showdown' && me && !me.folded && me.cards.length) sfx.lose(); else sfx.chip();
      if (me && me.cards.length) {
        const hand = !me.folded && s.board.length === 5 ? bestHand(me.cards.concat(s.board)) : null;
        recordHand(true, mine ? mine.amt : 0, hand);
      }
      break;
    }
    case 'chat': case 'seat': if (ev.text) say(vis(ev.seat), ev.text); break;
    case 'handEnd':
      if (G.mode !== 'cash') break;
      S.seated = G.myChips; save();
      if (me && me.chips <= 0) bustOnline();
      break;
    case 'sngEnd': {
      const mine = ev.ranks.find(r => r.seat === s.you);
      if (mine) { hideActions(); sngFinish(mine.rank, G.token); }
      break;
    }
  }
}

function applyState(s) {
  G.me = s.you >= 0 ? s.you : Math.max(0, s.reserved);
  const vis = i => (i - G.me + 5) % 5;
  s.seats.forEach((q, i) => {
    G.players[vis(i)] = { name: q.name, avatar: q.avatar, chips: q.chips, bet: q.bet, total: q.total, folded: q.folded,
      allIn: q.allIn, sitOut: q.sitOut, cards: q.cards, isHuman: i === s.you, showCards: q.cards.some(c => c != null),
      real: !q.isBot && i !== s.you, bot: q.isBot, tag: q.tag, out: q.out, rank: q.rank };
  });
  G.dealer = vis(s.dealer); G.turn = s.turn >= 0 ? vis(s.turn) : -1;
  G.turnEnd = s.turnLeft ? performance.now() + s.turnLeft : 0;
  G.sb = s.sb; G.bb = s.bb; G.handNo = s.handNo; G.inHand = !!s.inHand && !s.msg;
  if (s.board.length < G.board.length) els.slots.forEach(sl => { sl.innerHTML = ''; });
  G.board = s.board.slice();
  const me = s.you >= 0 ? s.seats[s.you] : null;
  G.myChips = me ? me.chips : s.buy;
  renderAll(); renderBoard();
  G.players.forEach((p, i) => {
    const t = p.tag ? p.tag.text + '|' + p.tag.cls : '';
    if (els.seats[i].dataset.tag !== t) { els.seats[i].dataset.tag = t; setTag(i, p.tag ? p.tag.text : '', p.tag ? p.tag.cls : ''); }
  });
  $('#msg').textContent = s.msg || (me || G.mode !== 'cash' ? '' : 'Taking a seat… you\'ll be dealt in next hand');
  const win = new Set(s.winCards || []);
  document.querySelectorAll('#board .card, #seats .card').forEach(el => {
    if (el.dataset.c == null) return;
    el.classList.toggle('win', win.has(+el.dataset.c));
    el.classList.toggle('dim', win.size > 0 && !win.has(+el.dataset.c));
  });
  const key = me && !me.folded ? me.cards.join() + '|' + s.board.join() + '|' + s.seats.filter(q => !q.folded).length : '';
  if (key !== G.infoKey) { G.infoKey = key; updateHumanInfo(); }
  if (s.options && s.turnId !== G.shownTurn) {
    G.shownTurn = s.turnId;
    const ws = G.ws;
    actionPanel(s.options, a => ws.send(JSON.stringify({ t: 'act', type: a.type, to: a.to })));
  } else if (!s.options) hideActions();
  $('#awayBtn').classList.toggle('hidden', !(me && me.away));
  const humans = s.seats.filter(q => !q.isBot).length;
  $('#hudMode').innerHTML = G.mode === 'cash'
    ? `CASH GAME · STAGE ${G.idx + 1}<small>🟢 Online · ${humans} ${humans === 1 ? 'player' : 'players'} here</small>`
    : `SIT-N-GO · STAGE ${G.idx + 1}<small>🟢 Live tournament · 1st ${short(SNG[G.idx].buy * 3.5)} · 2nd ${short(SNG[G.idx].buy * 1.5)}</small>`;
}

function bustOnline() {
  if (G.bustOpen) return;
  const g = G, c = CASH[G.idx];
  g.bustOpen = true;
  modal('Busted!', 'You ran out of chips at this table.\nBuy back in and keep playing?', [
    { label: 'REBUY', sub: fmt(c.buy), cls: 'btn-gold', value: 'rebuy', disabled: S.bankroll < c.buy },
    { label: 'LOBBY', cls: 'btn-slate', value: 'lobby' }]).then(v => {
    if (G !== g) return;
    g.bustOpen = false;
    if (v === 'rebuy' && S.bankroll >= c.buy) {
      S.bankroll -= c.buy; g.myChips = c.buy; S.seated = c.buy; save();
      g.ws.send(JSON.stringify({ t: 'rebuy' }));
    } else leaveTable();
  });
}

// ---------------------------------------------------------------- Sit-N-Go waiting room
// Buying in waits for five real players; anyone can switch to a tournament against bots instead.
let Q = null;
function startSng(idx) {
  if (S.bankroll < SNG[idx].buy) return;
  ac(); goLandscape();
  if (!wsUrl()) { startGame('sng', idx); return; }
  if (G) leaveTable();
  let ws;
  try { ws = new WebSocket(wsUrl()); } catch (e) { startGame('sng', idx); return; }
  Q = { ws, idx, players: null };
  ws.onopen = () => ws.send(JSON.stringify({ t: 'sngJoin', stage: idx, name: S.name, avatar: S.avatar }));
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.t === 'queue' && Q && Q.ws === ws) { Q.players = m.players; renderQueue(); }
    else if (m.t === 'joined' && m.mode === 'sng' && Q && Q.ws === ws) { Q = null; hideQueue(); startOnline(ws, idx, 'sng'); }
    else if (G && G.ws === ws) { G.queue.push(m); pump(); }
  };
  ws.onclose = async () => {
    if (Q && Q.ws === ws) {
      Q = null; hideQueue();
      const v = await modal('Server Unavailable', 'Couldn\'t reach the game server for a live tournament.\nPlay against bots instead?', [
        { label: 'PLAY WITH BOTS', sub: 'FREE PRACTICE', cls: 'btn-gold', value: 'bots' },
        { label: 'CANCEL', cls: 'btn-slate', value: 'cancel' }]);
      if (v === 'bots' && !G) startGame('sng', idx);

// ---------------------------------------------------------------- game flow
async function runTable(tok) {
  await wait(500);
  while (alive(tok)) {
    const P = G.players;
    if (G.mode === 'cash') {
      if (P[0].chips <= 0) {
        const c = CASH[G.idx];
        const v = await modal('Busted!', 'You ran out of chips at this table.\nBuy back in and keep playing?', [
          { label: 'REBUY', sub: fmt(c.buy), cls: 'btn-gold', value: 'rebuy', disabled: S.bankroll < c.buy },
          { label: 'LOBBY', cls: 'btn-slate', value: 'lobby' }]);
        if (!alive(tok)) return;
        if (v === 'rebuy' && S.bankroll >= c.buy) { S.bankroll -= c.buy; P[0].chips = c.buy; S.seated = c.buy; save(); renderAll(); }
        else { leaveTable(); return; }
      }
      for (let i = 1; i < 5; i++) if (P[i].chips <= 0) {
        const gone = P[i].name;
        P[i] = null; P[i] = newBot(botStack());
        els.seats[i].dataset.key = ''; renderSeat(i); say(i, 'Hi all! 👋');
        notice(`${gone} busted · ${P[i].name} took the seat`);
      }
    } else {
      if (P.filter(p => !p.out).length === 1) { await sngFinish(1, tok); return; }
    }
    await playHand(tok);
    if (!alive(tok)) return;
    if (G.mode === 'cash') { S.seated = P[0].chips; save(); }
    else {
      const busted = P.filter(p => !p.out && p.chips <= 0);
      if (busted.length) {
        const remaining = P.filter(p => !p.out && p.chips > 0).length;
        busted.sort((a, b) => b.startChips - a.startChips).forEach((p, k) => { p.out = true; p.rank = remaining + 1 + k; });
        renderAll();
        if (P[0].out) { await sleep(1200); await sngFinish(P[0].rank, tok); return; }
      }
    }
    await sleep(1600);
  }
}

async function sngFinish(rank, tok) {
  if (!alive(tok)) return;
  const practice = G.practice, buy = SNG[G.idx].buy;
  const prize = practice ? 0 : rank === 1 ? buy * 3.5 : rank === 2 ? buy * 1.5 : 0;
  S.bankroll += prize; if (rank === 1 && !practice) S.stats.sngWins++; save();
  rank <= 2 ? sfx.win() : sfx.lose();
  const title = rank === 1 ? '🏆 You Won!' : 'You Ranked ' + ord(rank);
  const body = practice
    ? (rank === 1 ? 'You beat the bots!\nPractice game: no chips won or lost.' : 'Practice game: no chips won or lost.\nGive it another go?')
    : rank === 1 ? `Champion of the table!\nYou take home ${fmt(prize)}.`
    : rank === 2 ? `So close! Runner-up prize:\n${fmt(prize)}.` : 'Nice try!\nBetter luck next time.\nGive it another go?';
  const idx = G.idx, online = G.online;
  const v = await modal(title, body, [
    { label: 'PLAY AGAIN', sub: practice ? 'FREE PRACTICE' : 'BUY-IN ' + fmt(buy), cls: 'btn-gold', value: 'again', disabled: !practice && S.bankroll < buy },
    { label: 'LOBBY', cls: 'btn-slate', value: 'lobby' }]);
  leaveTable();
  if (v === 'again') online ? startSng(idx) : startGame('sng', idx);
}

const nextIdx = (from, pred) => { for (let k = 1; k <= 5; k++) { const j = (from + k) % 5; if (pred(j)) return j; } return -1; };

async function playHand(tok) {
  const P = G.players;
  G.inHand = true; G.handActive = true;
  G.handNo++;
  if (G.mode === 'sng') {
    const lv = Math.min(Math.floor((G.handNo - 1) / SNG_HANDS_PER_LEVEL), SNG_BLINDS.length - 1);
    if (G.handNo > 1 && (G.handNo - 1) % SNG_HANDS_PER_LEVEL === 0 && lv < SNG_BLINDS.length) $('#msg').textContent = 'Blinds up!';
    [G.sb, G.bb] = SNG_BLINDS[lv];
  }
  P.forEach(p => {
    p.sitOut = !!p.out || p.chips <= 0;
    Object.assign(p, { cards: [], folded: p.sitOut, allIn: false, bet: 0, total: 0, acted: false, showCards: false, startChips: p.chips });
  });
  G.board = []; G.turn = -1;
  els.slots.forEach(s => s.innerHTML = '');
  clearTags(false); $('#handName').textContent = ''; setMeter(null);
  setTimeout(() => { if (alive(tok) && $('#msg').textContent === 'Blinds up!') $('#msg').textContent = ''; }, 1500);
  if ($('#msg').textContent !== 'Blinds up!') $('#msg').textContent = '';
  const live = i => !P[i].sitOut;
  G.dealer = nextIdx(G.dealer, live);
  const n = P.filter(p => !p.sitOut).length;
  const sbI = n === 2 ? G.dealer : nextIdx(G.dealer, live), bbI = nextIdx(sbI, live);
  const blind = (i, amt) => { const p = P[i], a = Math.min(amt, p.chips); p.chips -= a; p.bet = a; p.total = a; if (!p.chips) p.allIn = true; };
  blind(sbI, G.sb); blind(bbI, G.bb);
  G.currentBet = G.bb; G.minRaise = G.bb;
  renderAll(); sfx.chip(); sfx.shuffle();
  await sleep(700);

  // shuffle and deal
  const deck = []; for (let c = 0; c < 52; c++) deck.push(c);
  for (let i = 51; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  for (let r = 0; r < 2; r++) {
    for (let k = 0, i = sbI; k < n; k++, i = nextIdx(i, live)) {
      if (!alive(tok)) return;
      P[i].cards.push(deck.pop()); renderSeat(i); sfx.card(); await sleep(130);
    }
  }
  updateHumanInfo();

  await bettingRound(nextIdx(bbI, live), tok);
  for (const count of [3, 1, 1]) {
    if (!alive(tok)) return;
    if (P.filter(p => !p.folded).length <= 1) break;
    await collectBets();
    const canAct = i => !P[i].folded && !P[i].allIn;
    const actors = P.filter((p, i) => canAct(i)).length;
    if (actors <= 1 && !G.revealed) { // everyone is all-in: show the hands and run the board out
      G.revealed = true; P.forEach(p => { if (!p.folded) p.showCards = true; }); renderAll(); sfx.flip();
      await sleep(900);
    }
    deck.pop();
    for (let k = 0; k < count; k++) G.board.push(deck.pop());
    renderBoard(); sfx.flip(); await sleep(500);
    updateHumanInfo();
    if (actors >= 2) {
      P.forEach(p => { p.acted = false; });
      G.currentBet = 0; G.minRaise = G.bb;
      await bettingRound(nextIdx(G.dealer, canAct), tok);
    } else await sleep(900);
  }
  if (!alive(tok)) return;
  await collectBets();
  G.handActive = false;
  await showdown(tok);
  G.revealed = false;
}

async function bettingRound(start, tok) {
  const P = G.players;
  const needs = p => !p.folded && !p.allIn && (!p.acted || p.bet < G.currentBet);
  let i = start;
  for (let guard = 0; guard < 300; guard++) {
    if (!alive(tok)) return;
    if (P.filter(p => !p.folded).length <= 1) return;
    if (!P.some(needs)) return;
    const actors = P.filter(p => !p.folded && !p.allIn);
    if (actors.length === 1 && actors[0].bet >= G.currentBet) return;
    const p = P[i];
    if (needs(p)) {
      G.turn = i; renderSeat(i);
      const a = p.isHuman ? await humanAction(p) : await botAction(p);
      if (!alive(tok)) return;
      G.turn = -1;
      applyAction(i, a);
      renderAll();
    }
    i = (i + 1) % 5;
  }
}

function applyAction(i, a) {
  const P = G.players, p = P[i], toCall = G.currentBet - p.bet;
  const put = amt => { p.chips -= amt; p.bet += amt; p.total += amt; if (p.chips === 0) p.allIn = true; };
  if (a.type === 'fold') {
    p.folded = true; setTag(i, 'FOLD', 't-fold'); sfx.fold();
    if (i === 0) { $('#handName').textContent = ''; setMeter(null); }
  } else if (a.type === 'check') {
    setTag(i, 'CHECK', 't-check'); sfx.check();
  } else if (a.type === 'call' || (a.type === 'raise' && Math.min(a.to, p.chips + p.bet) <= G.currentBet)) {
    put(Math.min(toCall, p.chips)); setTag(i, p.allIn ? 'ALL-IN' : 'CALL', p.allIn ? 't-allin' : 't-call'); sfx.chip();
  } else {
    const to = Math.min(a.to, p.chips + p.bet), inc = to - G.currentBet, wasBet = G.currentBet === 0;
    if (inc >= G.minRaise) { G.minRaise = inc; P.forEach(q => { if (q !== p) q.acted = false; }); }
    G.currentBet = to; put(to - p.bet);
    setTag(i, p.allIn ? 'ALL-IN' : (wasBet ? 'BET ' : 'RAISE ') + short(to), p.allIn ? 't-allin' : 't-raise');
    sfx.chip(); setTimeout(sfx.chip, 90);
    if (!p.isHuman && p.allIn) botChat(i, ['All in! 😈', 'Let\'s go!', 'Ship it!'], .4);
  }
  p.acted = true;
}

async function collectBets() {
  const P = G.players;
  if (P.some(p => p.bet > 0)) await animateCollect();
  P.forEach(p => { p.bet = 0; });
  if (G) { clearTags(true); renderAll(); }
}

async function showdown(tok) {
  const P = G.players, live = P.filter(p => !p.folded), h = P[0];
  const total = P.reduce((a, p) => a + p.total, 0);
  const dealt = h.cards.length > 0;
  let humanWon = 0;
  if (live.length === 1) {
    const w = live[0], wi = P.indexOf(w);
    w.chips += total; flyChips(wi, total); sfx.chip();
    setTag(wi, 'WIN ' + short(total), 't-win');
    $('#msg').textContent = `${w.isHuman ? 'You win' : w.name + ' wins'} ${fmt(total)}`;
    if (w.isHuman) { humanWon = total; sfx.win(); }
    renderAll(); recordHand(dealt, humanWon, null);
    return;
  }
  live.forEach(p => { p.showCards = true; p.hand = bestHand(p.cards.concat(G.board)); });
  renderAll(); sfx.flip();
  await sleep(700);
  if (!alive(tok)) return;

  // main pot and side pots
  const levels = [...new Set(P.map(p => p.total).filter(t => t > 0))].sort((a, b) => a - b);
  const pots = []; let prev = 0;
  for (const L of levels) {
    const amt = P.reduce((a, p) => a + Math.min(p.total, L) - Math.min(p.total, prev), 0);
    const elig = live.filter(p => p.total >= L);
    if (!elig.length) { if (pots.length) pots[pots.length - 1].amt += amt; else pots.push({ amt, elig: live }); }
    else if (pots.length && pots[pots.length - 1].elig.length === elig.length) pots[pots.length - 1].amt += amt;
    else pots.push({ amt, elig });
    prev = L;
  }
  const won = new Map();
  for (const pot of pots) {
    const best = Math.max(...pot.elig.map(p => p.hand.score));
    const ws = pot.elig.filter(p => p.hand.score === best);
    const share = Math.floor(pot.amt / ws.length);
    ws.forEach((w, k) => won.set(w, (won.get(w) || 0) + share + (k === 0 ? pot.amt - share * ws.length : 0)));
  }
  live.forEach(p => setTag(P.indexOf(p), p.hand.name, 't-hand'));
  await sleep(600);
  if (!alive(tok)) return;

  // highlight the best hand of the main pot winner
  const top = [...won.keys()].sort((a, b) => b.hand.score - a.hand.score)[0];
  const winCards = new Set(top.hand.cards);
  document.querySelectorAll('#board .card, #seats .card').forEach(el => {
    if (el.dataset.c == null) return;
    el.classList.toggle('win', winCards.has(+el.dataset.c));
    el.classList.toggle('dim', !winCards.has(+el.dataset.c));
  });
  const names = [];
  won.forEach((amt, w) => {
    const wi = P.indexOf(w); w.chips += amt; flyChips(wi, amt);
    setTag(wi, 'WIN ' + short(amt), 't-win');
    names.push(w.isHuman ? 'You' : w.name);
    if (w.isHuman) humanWon = amt;
  });
  $('#msg').textContent = `${names.join(' & ')} ${names.length > 1 || names[0] === 'You' ? 'win' : 'wins'} with ${top.hand.name}`;
  if (humanWon) { sfx.win(); if (Math.random() < .5) { const losers = live.filter(p => !won.has(p)).map(p => P.indexOf(p)); if (losers.length) botChat(losers[0], ['Nice hand', 'No way!', 'Wow!'], 1); } }
  else if (live.includes(h)) { sfx.lose(); const wi = P.indexOf(top); if (wi > 0) botChat(wi, ['😎', 'Gotcha!', 'Thanks!'], .45); }
  renderAll();
  recordHand(dealt, humanWon, live.includes(h) ? h.hand : null);
  await sleep(1400);
}

function recordHand(dealt, humanWon, hand) {
  if (!dealt) return;
  const st = S.stats; st.hands++;
  if (humanWon > 0) { st.wins++; st.biggest = Math.max(st.biggest, humanWon); }
  if (hand && G.board.length === 5 && hand.score > st.bestScore) {
    st.bestScore = hand.score; st.bestCards = hand.cards; st.bestName = hand.name;
  }
  save();
}

// ---------------------------------------------------------------- players' decisions
function humanAction(p) {
  const P = G.players, toCall = G.currentBet - p.bet, maxTo = p.chips + p.bet;
  const o = { toCall, callAmt: Math.min(toCall, p.chips), chips: p.chips, bet: p.bet, currentBet: G.currentBet, maxTo,
    minTo: Math.min(G.currentBet + G.minRaise, maxTo), canRaise: p.chips > toCall && P.some(q => q !== p && !q.folded && !q.allIn),
    potAll: P.reduce((a, q) => a + q.total, 0), sb: G.sb };
  return new Promise(res => actionPanel(o, res));
}
// Shows the fold / call / raise controls for the options in o and calls done with the chosen action.
function actionPanel(o, done) {
  const { toCall, callAmt, maxTo, minTo, canRaise } = o;
  const slider = $('#slider');
  slider.min = minTo; slider.max = maxTo; slider.step = 1; slider.value = minTo;
  const setTo = v => {
    v = Math.max(minTo, Math.min(maxTo, v));
    if (v < maxTo) v = Math.max(minTo, Math.round(v / o.sb) * o.sb);
    slider.value = v;
    $('#raiseBtn').textContent = v >= maxTo ? 'ALL-IN ' + short(maxTo) : (o.currentBet === 0 ? 'BET ' : 'RAISE TO ') + short(v);
  };
  slider.oninput = () => setTo(+slider.value);
  document.querySelectorAll('.preset').forEach(b => {
    b.disabled = !canRaise;
    b.onclick = () => {
      sfx.click(); const k = b.dataset.p;
      setTo(k === 'min' ? minTo : k === 'all' ? maxTo : o.bet + toCall + Math.round(+k * (o.potAll + toCall)));
    };
  });
  slider.disabled = !canRaise; $('#raiseBtn').disabled = !canRaise;
  setTo(minTo);
  $('#callBtn').textContent = toCall === 0 ? 'CHECK' : (callAmt >= o.chips ? 'ALL-IN ' : 'CALL ') + short(callAmt);
  const finish = a => { hideActions(); done(a); };
  $('#foldBtn').onclick = () => finish({ type: 'fold' });
  $('#callBtn').onclick = () => finish({ type: toCall === 0 ? 'check' : 'call' });
  $('#raiseBtn').onclick = () => finish({ type: 'raise', to: +slider.value });
  G.humanAct = { fold: () => $('#foldBtn').click(), call: () => $('#callBtn').click(), raise: () => canRaise && $('#raiseBtn').click() };
  $('#timer').classList.toggle('hidden', !o.timeLeft);
  $('#actions').classList.remove('hidden');
  sfx.turn(); buzz([60, 50, 60]);
}
function buzz(pattern) { if (isPhone && navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} } }
function hideActions() { $('#actions').classList.add('hidden'); if (G) G.humanAct = null; }

async function botAction(p) {
  await sleep(550 + Math.random() * 750);
  return botDecide(p);
}

function botDecide(p) {
  const P = G.players, opp = P.filter(q => q !== p && !q.folded).length;
  const toCall = G.currentBet - p.bet, potAll = P.reduce((a, q) => a + q.total, 0);
  const potOdds = toCall > 0 ? toCall / (potAll + toCall) : 0;
  let eq = equity(p.cards, G.board, opp, 200);
  eq += (Math.random() - .5) * .08 + (p.loose - 1) * .06;
  const thr = b => b / (1 + .45 * (opp - 1));
  const others = P.some(q => q !== p && !q.folded && !q.allIn);
  const maxTo = p.chips + p.bet, r = Math.random(), A = p.aggr;
  const call = () => toCall > 0 ? { type: 'call' } : { type: 'check' };
  const fold = () => toCall > 0 ? { type: 'fold' } : { type: 'check' };
  const raise = frac => {
    if (!others) return call();
    let to = G.currentBet + Math.max(G.minRaise, Math.round((potAll + toCall) * frac / G.sb) * G.sb);
    if (to >= maxTo * .75) to = maxTo;
    return { type: 'raise', to: Math.min(to, maxTo) };
  };
  if (eq >= thr(.85) && others && r < .25 * A) return { type: 'raise', to: maxTo };
  if (eq >= thr(.72)) return r < .7 * A ? raise(.6 + Math.random() * .5) : call();
  if (eq >= thr(.56)) {
    if (toCall === 0) return r < .45 * A ? raise(.5) : call();
    if (eq > potOdds + .05 || toCall <= G.bb * 2) return r < .15 * A ? raise(.7) : call();
    return fold();
  }
  if (eq >= thr(.42) || eq > potOdds + .04) {
    if (toCall === 0) return r < .12 * A ? raise(.5) : call();
    return eq > potOdds ? call() : fold();
  }
  if (toCall === 0) return r < .07 * A ? raise(.6) : call();
  if (toCall <= G.bb && G.board.length === 0 && r < .35 * p.loose) return call();
  return fold();
}

// ---------------------------------------------------------------- table controls
$('#menuBtn').onclick = () => { sfx.click(); $('#menu').classList.toggle('hidden'); $('#chat').classList.add('hidden'); };
$('#chatBtn').onclick = () => { sfx.click(); $('#chat').classList.toggle('hidden'); $('#menu').classList.add('hidden'); };
$('#mLeave').onclick = async () => {
  $('#menu').classList.add('hidden');
  if (G && G.mode === 'cash') {
    const me = G.players[0], inHand = G.online ? G.inHand : G.inHand && G.handActive;
    if (me && me.isHuman && inHand && me.cards.length && !me.folded && me.total > 0) {
      const v = await modal('Leave Mid-Hand?', `You're in the middle of a hand.\nLeaving now forfeits the ${fmt(me.total)} you've put in this pot.`, [
        { label: 'STAY', cls: 'btn-gold', value: 'stay' }, { label: 'LEAVE', cls: 'btn-slate', value: 'leave' }]);
      if (v !== 'leave' || !G) return;
    }
  }
  if (G && G.mode === 'sng' && !G.practice) {
    const v = await modal('Leave Tournament?', 'Leaving early forfeits your buy-in\nand any prize you could still win.', [
      { label: 'STAY', cls: 'btn-gold', value: 'stay' }, { label: 'LEAVE', cls: 'btn-slate', value: 'leave' }]);
    if (v !== 'leave') return;
  }
  leaveTable();
};
$('#awayBtn').onclick = () => { if (G && G.online) G.ws.send(JSON.stringify({ t: 'back' })); };
$('#mSound').onclick = () => { S.muted = !S.muted; save(); renderMenu(); sfx.click(); };
$('#mMeter').onclick = () => { S.meter = !S.meter; save(); renderMenu(); $('#meter').classList.toggle('hidden', !S.meter); if (G) updateHumanInfo(); };
$('#mSpeed').onclick = () => { S.fast = !S.fast; save(); renderMenu(); };
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'm') { S.muted = !S.muted; save(); if (G) renderMenu(); else renderLobby(); return; }
  if (!G || !G.humanAct || !$('#modal').classList.contains('hidden')) return;
  if (k === 'f') G.humanAct.fold();
  else if (k === 'c' || k === ' ') { e.preventDefault(); G.humanAct.call(); }
  else if (k === 'r') G.humanAct.raise();
});

// ---------------------------------------------------------------- scale to window
// Phones held upright get the table drawn sideways, so turning the phone shows it in landscape.
const isPhone = matchMedia('(pointer: coarse)').matches;
function fit() {
  const W = document.documentElement.clientWidth, H = document.documentElement.clientHeight;
  const sideways = isPhone && H > W;
  const s = sideways ? Math.min(H / 1280, W / 720) : Math.min(W / 1280, H / 720);
  $('#stage').style.transform = `translate(-50%,-50%) ${sideways ? 'rotate(90deg) ' : ''}scale(${s})`;
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200)); fit();
// Where the browser allows it (Android), go full screen and lock the screen to landscape.
function goLandscape() {
  if (!isPhone || document.fullscreenElement || document.webkitFullscreenElement) return;
  const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  try {
    Promise.resolve(req.call(el))
      .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
      .catch(() => {});
  } catch (e) {}
}
document.addEventListener('pointerdown', goLandscape, { once: true });
document.body.classList.toggle('mobile', isPhone);
// Offer "Add to Home Screen": Android shows its own install prompt, iPhone needs the Share menu.
const standalone = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
let installPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; document.body.classList.add('can-install'); });
if (isIOS && !standalone) document.body.classList.add('can-install');
$('#installBtn').onclick = () => {
  sfx.click();
  if (installPrompt) { installPrompt.prompt(); installPrompt = null; document.body.classList.remove('can-install'); return; }
  modal('Install Hold-em Royale', 'Tap the Share button in Safari,\nthen "Add to Home Screen".\nThe game opens full screen from your home screen.', [{ label: 'OK', cls: 'btn-gold' }]);
};
renderLobby(); checkServer();
